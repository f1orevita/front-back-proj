<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL Injection — Захищена версія</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">SQL Injection Demo — ЗАХИЩЕНА ВЕРСІЯ (Порт 3001)</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- Ліва колонка: Авторизація -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    <strong>1. Захищена форма входу (POST /login)</strong>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginInput" class="form-label">Логін:</label>
                            <input type="text" class="form-control" id="loginInput" name="login" placeholder="Введіть логін" required>
                        </div>
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Пароль:</label>
                            <input type="text" class="form-control" id="passwordInput" name="password" placeholder="Введіть пароль" required>
                        </div>
                        <button type="submit" class="btn btn-success">Увійти</button>
                    </form>

                    <hr/>
                    <p class="mb-2"><strong>Швидка підстановка для демо:</strong></p>
                    <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="fillLogin('normal')">Звичайний вхід (student)</button>
                    <button type="button" class="btn btn-outline-danger btn-sm mb-1" onclick="fillLogin('bypass')">Обхід (admin' --)</button>
                    <button type="button" class="btn btn-outline-danger btn-sm mb-1" onclick="fillLogin('tautology')">Тавтологія (OR 1=1)</button>
                    <button type="button" class="btn btn-outline-warning btn-sm mb-1" onclick="fillLogin('error')">Error-based (')</button>

                    <div id="loginResult" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Права колонка: Пошук товарів -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    <strong>2. Захищений пошук товарів (GET /search)</strong>
                </div>
                <div class="card-body">
                    <form id="searchForm">
                        <div class="mb-3">
                            <label for="searchInput" class="form-label">Назва товару:</label>
                            <input type="text" class="form-control" id="searchInput" name="q" placeholder="Наприклад: миша">
                        </div>
                        <button type="submit" class="btn btn-success">Знайти</button>
                    </form>

                    <hr/>
                    <p class="mb-2"><strong>Швидка підстановка для демо:</strong></p>
                    <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="fillSearch('normal')">Звичайний пошук</button>
                    <button type="button" class="btn btn-outline-danger btn-sm mb-1" onclick="fillSearch('users')">UNION: логіни й паролі</button>
                    <button type="button" class="btn btn-outline-danger btn-sm mb-1" onclick="fillSearch('secret')">UNION: секрет адміна</button>
                    <button type="button" class="btn btn-outline-danger btn-sm mb-1" onclick="fillSearch('tables')">UNION: список таблиць</button>

                    <div id="searchResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="script.js"></script>
</body>
</html>
